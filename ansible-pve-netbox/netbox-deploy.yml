---
- name: Deploy NetBox on the netbox LXC
  hosts: netbox
  vars:
    stack_dir: "{{ ansible_env.HOME }}/netbox-docker"
    # Scoped read-only to this playbook's own /ansible-pve-netbox folder via
    # a dedicated machine identity - same least-privilege-per-consumer
    # pattern as ansible-pve-docker-green's traefik-portainer.yml (see
    # homelab-pipeline README).
    netbox_secrets: "{{ lookup('infisical.vault.read_secrets',
      universal_auth_client_id=infisical_client_id,
      universal_auth_client_secret=infisical_client_secret,
      project_id=infisical_project_id,
      env_slug='prod',
      path='/ansible-pve-netbox',
      as_dict=True,
      url=infisical_host
      ) }}"

    # Same identity as above, granted an additional scoped-read privilege
    # on /shared (see SECRETS.md) - Route53 DNS-01 credentials for Caddy's
    # Let's Encrypt cert, shared with docker-infisical's own Caddy rather
    # than duplicated per-consumer.
    shared_secrets: "{{ lookup('infisical.vault.read_secrets',
      universal_auth_client_id=infisical_client_id,
      universal_auth_client_secret=infisical_client_secret,
      project_id=infisical_project_id,
      env_slug='prod',
      path='/shared',
      as_dict=True,
      url=infisical_host
      ) }}"

  tasks:
    - name: Check whether the stack directory is already a git checkout
      ansible.builtin.stat:
        path: "{{ stack_dir }}/.git"
      register: stack_dir_git

    - name: Remove non-git stack directory before first git-based deploy
      ansible.builtin.file:
        path: "{{ stack_dir }}"
        state: absent
      when: not stack_dir_git.stat.exists

    # Pinned to a real release tag (confirmed live via the GitHub API, not
    # guessed), not the `release` branch - a redeploy shouldn't silently
    # pick up whatever's newest. Bump deliberately when moving forward.
    #
    # force=true, unlike traefik-portainer.yml's equivalent step - confirmed
    # live this actually matters here: unlike that playbook's secrets/
    # directory (untracked, outside the repo's tree), NetBox's env files
    # (env/*.env below) are real *tracked* files in netbox-docker's own
    # repo, and this playbook overwrites them in place with real secrets.
    # On any redeploy, git's default force=no sees that as a local
    # modification and refuses ("Local modifications exist in the
    # destination"). Safe to force here specifically because the env-file
    # tasks below always run immediately after, in the same play - any
    # reset to the pinned tag's demo content gets overwritten with real
    # secrets again before docker compose ever sees it.
    - name: Clone/update netbox-docker from GitHub
      ansible.builtin.git:
        repo: https://github.com/netbox-community/netbox-docker.git
        dest: "{{ stack_dir }}"
        version: "{{ netbox_docker_version | default('5.0.2') }}"
        force: true

    # The four env files below are real config, committed upstream with
    # demo placeholder secrets (confirmed live - the same passwords appear
    # verbatim in netbox-docker's own repo) - not something to copy as-is.
    # DB_PASSWORD (netbox.env) must exactly match POSTGRES_PASSWORD
    # (postgres.env); REDIS_PASSWORD (netbox.env) must match redis.env's
    # own REDIS_PASSWORD; REDIS_CACHE_PASSWORD (netbox.env) must match
    # redis-cache.env's own REDIS_PASSWORD - redis.env and redis-cache.env
    # both use the literal key name REDIS_PASSWORD for their own service,
    # netbox.env just needs both simultaneously so it disambiguates them.
    - name: Write env/postgres.env
      ansible.builtin.copy:
        dest: "{{ stack_dir }}/env/postgres.env"
        content: |
          POSTGRES_DB=netbox
          POSTGRES_USER=netbox
          POSTGRES_PASSWORD={{ netbox_secrets.NETBOX_DB_PASSWORD }}
        mode: '0600'

    - name: Write env/redis.env
      ansible.builtin.copy:
        dest: "{{ stack_dir }}/env/redis.env"
        content: |
          REDIS_PASSWORD={{ netbox_secrets.NETBOX_REDIS_PASSWORD }}
        mode: '0600'

    - name: Write env/redis-cache.env
      ansible.builtin.copy:
        dest: "{{ stack_dir }}/env/redis-cache.env"
        content: |
          REDIS_PASSWORD={{ netbox_secrets.NETBOX_REDIS_CACHE_PASSWORD }}
        mode: '0600'

    # SKIP_SUPERUSER=true (upstream default, kept) - create the admin user
    # manually post-deploy instead:
    #   docker compose exec netbox /opt/netbox/netbox/manage.py createsuperuser
    # avoids one more secret to manage for a one-time bootstrap action.
    #
    # SECRET_KEY/API_TOKEN_PEPPER_1 are single-quoted, matching upstream's
    # own demo env file exactly - docker compose's env_file parser treats an
    # unquoted `#` as a comment start, and NetBox's own recommended
    # generator for these two specifically uses a wide special-character
    # set that can include one. DB/Redis passwords are generated from a
    # plain alphanumeric charset instead, sidestepping the issue entirely
    # rather than needing the same quoting.
    - name: Write env/netbox.env
      ansible.builtin.copy:
        dest: "{{ stack_dir }}/env/netbox.env"
        content: |
          API_TOKEN_PEPPER_1='{{ netbox_secrets.NETBOX_API_TOKEN_PEPPER }}'
          CORS_ORIGIN_ALLOW_ALL=True
          DB_HOST=postgres
          DB_NAME=netbox
          DB_USER=netbox
          DB_PASSWORD={{ netbox_secrets.NETBOX_DB_PASSWORD }}
          GRAPHQL_ENABLED=true
          METRICS_ENABLED=false
          REDIS_CACHE_DATABASE=1
          REDIS_CACHE_HOST=redis-cache
          REDIS_CACHE_PASSWORD={{ netbox_secrets.NETBOX_REDIS_CACHE_PASSWORD }}
          REDIS_CACHE_SSL=false
          REDIS_DATABASE=0
          REDIS_HOST=redis
          REDIS_PASSWORD={{ netbox_secrets.NETBOX_REDIS_PASSWORD }}
          REDIS_SSL=false
          SECRET_KEY='{{ netbox_secrets.NETBOX_SECRET_KEY }}'
          SKIP_SUPERUSER=true
          WEBHOOKS_ENABLED=true
        mode: '0600'

    - name: Ensure secrets directory exists
      ansible.builtin.file:
        path: "{{ stack_dir }}/secrets"
        state: directory
        mode: '0700'

    # Same file-based AWS credential pattern as docker-infisical/deploy.yml -
    # the route53 Caddy plugin picks this up via AWS_SHARED_CREDENTIALS_FILE
    # (see docker-compose.override.yml below), not a plain env var.
    - name: Write the AWS credentials file for Caddy's Route53 DNS-01 challenge
      ansible.builtin.copy:
        dest: "{{ stack_dir }}/secrets/aws_credentials"
        content: |
          [default]
          aws_access_key_id = {{ shared_secrets.ROUTE53_BAUER_ACCESS_KEY_ID }}
          aws_secret_access_key = {{ shared_secrets.ROUTE53_BAUER_SECRET_ACCESS_KEY }}
        mode: '0600'

    # caddy/Dockerfile and caddy/Caddyfile live in this repo, not upstream
    # netbox-docker (unlike docker-infisical, which owns its whole compose
    # stack as a self-authored repo) - copied onto the host same as the
    # override file below.
    - name: Ensure the Caddy build context directory exists
      ansible.builtin.file:
        path: "{{ stack_dir }}/caddy"
        state: directory
        mode: '0755'

    - name: Copy the Caddy build context onto the host
      ansible.builtin.copy:
        src: "caddy/{{ item }}"
        dest: "{{ stack_dir }}/caddy/{{ item }}"
        mode: '0644'
      loop:
        - Dockerfile
        - Caddyfile

    # netbox-docker's default docker-compose.yml publishes no port to the
    # host at all - confirmed live (grep for `ports:` in the actual file
    # comes back empty) - it expects a reverse proxy in front by
    # convention. Caddy is that reverse proxy, terminating real Let's
    # Encrypt TLS via Route53 DNS-01 (same pattern as docker-infisical) -
    # NetBox itself is no longer published directly, Caddy is the sole
    # public entry point.
    - name: Write docker-compose.override.yml to add the Caddy reverse proxy
      ansible.builtin.copy:
        dest: "{{ stack_dir }}/docker-compose.override.yml"
        content: |
          services:
            caddy:
              container_name: netbox-caddy
              build:
                context: ./caddy
              image: netbox-caddy:2.11.4-route53-1.6.2
              restart: unless-stopped
              environment:
                - NETBOX_HOST={{ netbox_host }}
                - AWS_SHARED_CREDENTIALS_FILE=/run/secrets/aws_credentials
                - AWS_REGION={{ shared_secrets.ROUTE53_BAUER_REGION | default('us-east-1') }}
                - AWS_HOSTED_ZONE_ID={{ shared_secrets.ROUTE53_BAUER_HOSTED_ZONE_ID | default('') }}
              secrets:
                - aws_credentials
              ports:
                - "80:80"
                - "443:443"
              volumes:
                - caddy-data:/data
              depends_on:
                - netbox

          secrets:
            aws_credentials:
              file: ./secrets/aws_credentials

          volumes:
            caddy-data:
        mode: '0644'

    # Confirmed live: on a genuinely fresh deploy, the netbox container's
    # first-run migrations/static-collection reliably take longer than its
    # healthcheck's 90s start_period, so `docker compose up -d` (which waits
    # on netbox-worker's dependency condition: service_healthy) fails the
    # first time with "dependency netbox failed to start" even though the
    # container goes healthy moments later on its own. Retrying rather than
    # failing outright - each retry is a plain `docker compose up -d`, which
    # is idempotent and just re-attaches to whatever's already healthy once
    # netbox catches up.
    # --build so an updated Caddyfile/Dockerfile actually gets baked into a
    # fresh image - `up -d` alone reuses whatever was already built under
    # this same image tag, silently ignoring source changes.
    - name: Deploy the NetBox stack
      ansible.builtin.command: docker compose up -d --build
      args:
        chdir: "{{ stack_dir }}"
      changed_when: true
      register: compose_up
      retries: 6
      delay: 30
      until: compose_up.rc == 0
