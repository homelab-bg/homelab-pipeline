---
- name: Deploy Traefik + Portainer
  hosts: bootstrap
  vars:
    stack_dir: "{{ ansible_env.HOME }}/traefik-portainer"

  tasks:
    - name: Ensure remote stack directory exists
      ansible.builtin.file:
        path: "{{ stack_dir }}"
        state: directory
        mode: '0755'

    - name: Copy docker-traefik-portainer stack files
      ansible.posix.synchronize:
        src: "{{ playbook_dir }}/../docker-traefik-portainer/"
        dest: "{{ stack_dir }}/"
        rsync_opts:
          - "--exclude=.git"

    - name: Ensure CephFS bind-mount source directories exist
      ansible.builtin.file:
        path: "/mnt/cephfs/traefik-portainer/{{ item }}"
        state: directory
        mode: '0755'
      become: true
      loop:
        - letsencrypt
        - portainer-data
      # Swarm mode (unlike `docker run`/`docker compose up`) doesn't auto-create
      # a missing bind-mount host path - it rejects the task outright. Since
      # /mnt/cephfs is shared, creating these once here (any node) is enough.

    - name: Deploy the traefik-portainer stack
      ansible.builtin.command: docker stack deploy -c docker-compose.yml -c docker-compose.swarm.yml traefik-portainer
      environment:
        TRAEFIK_HOST: "{{ traefik_domain }}"
        LETSENCRYPT_EMAIL: "{{ traefik_email }}"
        PORTAINER_HOST: "{{ portainer_domain }}"
        PORTAINER_PORT: "{{ portainer_port | default('9000') }}"
        PORTAINER_EDITION: "{{ portainer_edition | default('ee') }}"
        PORTAINER_VER: "{{ portainer_version | default('2.33.1') }}"
        TRAEFIK_VER: "{{ traefik_version | default('v3.7.10') }}"
        NETWORK: "{{ network_name | default('traefik') }}"
        MONITORING_STACK: "{{ monitoring_stack | default('traefik-portainer') }}"
        AWS_ACCESS_KEY_ID: "{{ route53_access_key_id }}"
        AWS_SECRET_ACCESS_KEY: "{{ route53_secret_access_key }}"
        AWS_REGION: "{{ route53_region | default('us-east-1') }}"
        AWS_HOSTED_ZONE_ID: "{{ route53_hosted_zone_id | default('') }}"
      args:
        chdir: "{{ stack_dir }}"
      changed_when: true
