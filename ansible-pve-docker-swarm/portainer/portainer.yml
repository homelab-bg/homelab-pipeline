---
- name: Deploy Portainer
  hosts: bootstrap

  tasks:
    - name: Copy portainer dir
      ansible.posix.synchronize:
        src: .
        dest: .

    - name: Add portainer label for the data-volume node
      ansible.builtin.command: docker node update --label-add portainer.portainer-data=true {{ inventory_hostname }}
      changed_when: true

    - name: Deploy portainer
      ansible.builtin.command: docker stack deploy -c portainer/docker-compose.yml portainer
      environment:
        DOMAIN: '{{ portainer_domain }}'
      args:
        chdir: $HOME
      changed_when: true

# Portainer Business Edition license activation and GitOps stack/repo configuration
# happen through the Portainer UI/API on first login - not automated here yet.
