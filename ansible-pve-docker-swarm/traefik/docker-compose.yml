---
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "1m"
    max-file: "1"
    tag: "{{.Name}}"

x-common-labels: &default-labels
  logging: "promtail"
  logging_jobname: "containerlogs"
  stackname: "${MONITORING_STACK:-traefik}"

services:
  traefik:
    image: traefik:${TRAEFIK_VER:-v3.5.1}
    ports:
      - 80:80
      - 443:443
    environment:
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_HOSTED_ZONE_ID=${AWS_HOSTED_ZONE_ID}
    command:
      # Docker provider, swarm mode - only pick up services carrying our constraint label
      - --providers.docker
      - --providers.docker.swarmmode=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.constraints=Label(`traefik.constraint-label`, `${NETWORK:-traefik}`)
      # Entrypoints - plain HTTP globally redirected to HTTPS
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      # Let's Encrypt via Route53 DNS-01 - works for internal-only records, no port 80/443
      # exposed to the internet required (unlike a TLS-01/HTTP-01 challenge)
      - --certificatesresolvers.letsencrypt.acme.dnschallenge=true
      - --certificatesresolvers.letsencrypt.acme.dnschallenge.provider=route53
      - --certificatesresolvers.letsencrypt.acme.dnschallenge.resolvers=${DNS_RESOLVER:-9.9.9.9}
      - --certificatesresolvers.letsencrypt.acme.dnschallenge.delayBeforeCheck=30
      - --certificatesresolvers.letsencrypt.acme.email=${EMAIL?Variable not set}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --api.dashboard=true
      - --api.insecure=false
      - --accesslog
      - --log
    volumes:
      # Read-only access to the socket so Traefik can watch service labels
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Certs live here - pinned to one node via the placement constraint below
      - traefik-certificates:/letsencrypt
    networks:
      - traefik
    deploy:
      placement:
        constraints:
          # Local volume for certs - must always land on the same node
          - node.labels.traefik-certs == true
      labels:
        <<: *default-labels
        traefik.enable: "true"
        traefik.docker.network: "${NETWORK:-traefik}"
        traefik.constraint-label: "${NETWORK:-traefik}"
        # HTTP Basic auth on the dashboard - upstream reference stack doesn't gate this,
        # keeping it since the dashboard would otherwise be reachable to anyone who can
        # resolve/reach the host, with only the TLS cert as a barrier
        traefik.http.middlewares.admin-auth.basicauth.users: "${USERNAME?Variable not set}:${HASHED_PASSWORD?Variable not set}"
        traefik.http.routers.traefik.rule: "Host(`${DOMAIN?Variable not set}`)"
        traefik.http.routers.traefik.entrypoints: websecure
        traefik.http.routers.traefik.tls: "true"
        traefik.http.routers.traefik.tls.certresolver: letsencrypt
        traefik.http.routers.traefik.service: api@internal
        traefik.http.routers.traefik.middlewares: admin-auth
        traefik.http.services.traefik.loadbalancer.server.port: "8080"
    logging: *default-logging

volumes:
  traefik-certificates:

networks:
  # Shared with every other stack that wants to sit behind this proxy (e.g. portainer/,
  # and any app stack built on the docker-hello-world pattern) - same ${NETWORK} default
  # ("traefik") as those repos, so they attach to this one without needing an override.
  traefik:
    external: true
    name: "${NETWORK:-traefik}"
