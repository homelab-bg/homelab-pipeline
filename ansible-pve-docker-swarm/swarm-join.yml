---
- name: Read the manager join token from the bootstrap node
  hosts: bootstrap
  gather_facts: false
  tasks:
    - name: Read swarm join tokens
      community.docker.docker_swarm_info:
      register: swarm_info

    - name: Share the manager join token + bootstrap address with the other nodes
      ansible.builtin.set_fact:
        manager_join_token: "{{ swarm_info.swarm_facts.JoinTokens.Manager }}"
        bootstrap_addr: "{{ ansible_host }}"

- name: Join the remaining nodes to the swarm as managers
  hosts: swarm:!bootstrap
  tasks:
    - name: Join the swarm as a manager
      community.docker.docker_swarm:
        state: join
        advertise_addr: "{{ ansible_host }}"
        join_token: "{{ hostvars[groups['bootstrap'][0]].manager_join_token }}"
        remote_addrs:
          - "{{ hostvars[groups['bootstrap'][0]].bootstrap_addr }}:2377"
