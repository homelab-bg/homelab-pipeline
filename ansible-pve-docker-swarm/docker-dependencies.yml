---
- name: Install and configure Docker on every swarm node
  hosts: swarm
  become: true
  tasks:
    - name: Upgrade all packages to the latest version
      ansible.builtin.apt:
        name: '*'
        state: latest # noqa: package-latest - deliberate full upgrade, not a pinned install
        update_cache: true

    - name: Create keyring directory for apt signing keys
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Add Docker's GPG key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'

    - name: Add Docker's APT repository
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present
        filename: 'docker'

    - name: Install Docker
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
          - python3-docker # Docker SDK for Python - required by the community.docker.* modules
        state: present
        update_cache: true

    - name: Run whoami without become.
      ansible.builtin.command: whoami
      changed_when: false
      become: false
      register: whoami

    - name: Set a fact with the user name.
      ansible.builtin.set_fact:
        login_user: '{{ whoami.stdout }}'

    - name: Add the current user to 'docker' group
      become: true
      ansible.builtin.user:
        name: '{{ whoami.stdout }}'
        groups: docker
        append: true

    - name: Reset SSH connection to refresh user groups
      ansible.builtin.meta: reset_connection
