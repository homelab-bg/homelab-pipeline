---
- name: Apply host-level fixes required for virt-customize/supermin to work
  hosts: packer_builder
  become: true
  vars:
    # Both names loop together throughout this playbook - which one(s) exist
    # varies by host, and handoff notes from the original manual setup are
    # explicit not to hardcode just one.
    passt_apparmor_profiles:
      - passt
      - usr.bin.passt
  tasks:
    # Supermin needs to read a kernel image to build its appliance - but it
    # doesn't necessarily pick the currently-running one. Confirmed live: a
    # newer kernel (installed by unattended-upgrades, no reboot yet) sat at
    # its default 0600 while the running kernel's vmlinuz was still 0644
    # from an earlier run of this task, and supermin picked the newer
    # (unreadable) one anyway, breaking every Ubuntu build until this was
    # widened. Covers every vmlinuz-* present in /boot, not just
    # ansible_kernel, for exactly that reason - also mirrored as a
    # self-healing step directly in packer-build-templates.yml, since a
    # kernel update can land silently between one run of this playbook and
    # the next CI trigger.
    - name: Find all kernel images in /boot
      ansible.builtin.find:
        paths: /boot
        patterns: 'vmlinuz-*'
      register: boot_kernels

    - name: Make all kernel images world-readable
      ansible.builtin.file:
        path: "{{ item.path }}"
        mode: '0644'
      loop: "{{ boot_kernels.files }}"

    # KVM acceleration without running as root. Only takes effect on a fresh
    # login, hence the reset_connection below - doesn't affect an
    # already-open session.
    - name: Determine the SSH login user
      ansible.builtin.command: whoami
      changed_when: false
      become: false
      register: whoami

    - name: Add the login user to the 'kvm' group
      ansible.builtin.user:
        name: "{{ whoami.stdout }}"
        groups: kvm
        append: true

    - name: Reset SSH connection to refresh user groups
      ansible.builtin.meta: reset_connection

    # passt's shipped AppArmor profile denies mknod on the randomized temp
    # paths libguestfs/passt use for sockets/PID files - only visible via
    # `journalctl -k`, not plain dmesg. Confirmed live: re-running
    # `apparmor_parser -R` on an already-disabled profile exits non-zero
    # ("Profile doesn't exist"), so this has to check first rather than run
    # unconditionally. Uses apparmor_parser -R directly rather than
    # aa-complain/apparmor-utils, which trips an unrelated parser error on a
    # different, pre-existing broken profile elsewhere on this host when it
    # tries to reload everything.
    - name: Check which AppArmor passt profiles exist
      ansible.builtin.stat:
        path: "/etc/apparmor.d/{{ item }}"
      loop: "{{ passt_apparmor_profiles }}"
      register: passt_profile_stats

    - name: Check which passt AppArmor profiles are already disabled
      ansible.builtin.stat:
        path: "/etc/apparmor.d/disable/{{ item }}"
      loop: "{{ passt_apparmor_profiles }}"
      register: passt_disabled_stats

    - name: Disable passt AppArmor profiles not yet disabled
      ansible.builtin.command: "apparmor_parser -R /etc/apparmor.d/{{ item.0 }}"
      loop: "{{ passt_apparmor_profiles | zip(passt_profile_stats.results, passt_disabled_stats.results) | list }}"
      when: item.1.stat.exists and not item.2.stat.exists
      changed_when: true

    - name: Symlink disabled passt AppArmor profiles into disable/
      ansible.builtin.file:
        src: "/etc/apparmor.d/{{ item.0 }}"
        dest: "/etc/apparmor.d/disable/{{ item.0 }}"
        state: link
      loop: "{{ passt_apparmor_profiles | zip(passt_profile_stats.results, passt_disabled_stats.results) | list }}"
      when: item.1.stat.exists

    # Ubuntu 24.04+ hardening default blocks unprivileged unshare(), which
    # passt needs for its own sandboxing once its AppArmor profile is
    # removed (unconfined processes are exactly what this restriction
    # targets).
    - name: Disable kernel.apparmor_restrict_unprivileged_userns
      ansible.posix.sysctl:
        name: kernel.apparmor_restrict_unprivileged_userns
        value: '0'
        sysctl_file: /etc/sysctl.d/60-apparmor-namespace.conf
        state: present
        reload: true

    # Supermin's automatic host-package-dependency scan doesn't reliably
    # pull dhcpcd-base into the built appliance even when it's installed on
    # the host (open upstream gap, Debian bug #1111785). Without it:
    # `dhcpcd: command not found` inside the appliance, and since the
    # appliance's DHCP flow also writes resolv.conf, name resolution fails
    # too. This edits a file owned by libguestfs-tools, so it's the fix most
    # likely to silently regress on a package upgrade - worth a periodic
    # check, not a one-time assumption.
    - name: Add dhcpcd-base to supermin's appliance package list
      ansible.builtin.lineinfile:
        path: /usr/lib/x86_64-linux-gnu/guestfs/supermin.d/packages
        line: dhcpcd-base
      register: supermin_packages

    - name: Invalidate any cached appliance built before the dhcpcd-base fix
      ansible.builtin.shell: rm -rf /var/tmp/.guestfs-*
      when: supermin_packages is changed
      changed_when: true

    # Confirmed live: unattended-upgrades patched curl/libcurl mid-job, and
    # needrestart (invoked non-interactively by the apt hook) auto-restarted
    # the GitHub Actions runner service because it links against libcurl -
    # killing the in-flight job (GitHub reports this as "canceled", with no
    # useful error - had to be root-caused from the host's own journal/apt
    # logs, not anything in the workflow's output). This still patches
    # packages automatically; it just stops needrestart from yanking this
    # one service. A single-key assignment into needrestart's existing
    # override_rc hash, not a full reassignment - the main
    # /etc/needrestart/needrestart.conf already populates that hash with its
    # own defaults (docker, libvirt, etc.), and reassigning the whole hash
    # here would silently clobber all of those.
    - name: Don't let needrestart auto-restart the GitHub Actions runner service
      ansible.builtin.copy:
        dest: /etc/needrestart/conf.d/packer-builder-runner.conf
        content: |
          $nrconf{override_rc}{qr(^actions\.runner)} = 0;
        mode: '0644'
