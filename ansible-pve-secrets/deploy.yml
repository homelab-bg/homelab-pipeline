---
- name: Deploy Infisical stack on the secrets LXC
  hosts: secrets
  vars:
    stack_dir: "{{ ansible_env.HOME }}/docker-infisical"

  tasks:
    - name: Check whether the stack directory is already a git checkout
      ansible.builtin.stat:
        path: "{{ stack_dir }}/.git"
      register: stack_dir_git

    # Same one-time transition safety as ansible-pve-docker-green's
    # traefik-portainer.yml - harmless once it's a real checkout (this is
    # skipped on every later run).
    - name: Remove non-git stack directory before first git-based deploy
      ansible.builtin.file:
        path: "{{ stack_dir }}"
        state: absent
      when: not stack_dir_git.stat.exists

    - name: Clone/update docker-infisical from GitHub
      ansible.builtin.git:
        repo: https://github.com/homelab-bg/docker-infisical.git
        dest: "{{ stack_dir }}"
        version: "{{ docker_infisical_version | default('2026.08.9') }}"

    - name: Ensure secrets directory exists
      ansible.builtin.file:
        path: "{{ stack_dir }}/secrets"
        state: directory
        mode: '0700'

    - name: Write the AWS credentials file for Caddy's Route53 DNS-01 challenge
      ansible.builtin.copy:
        dest: "{{ stack_dir }}/secrets/aws_credentials"
        content: |
          [default]
          aws_access_key_id = {{ route53_bauer_access_key_id }}
          aws_secret_access_key = {{ route53_bauer_secret_access_key }}
        mode: '0600'

    # Infisical's own ENCRYPTION_KEY/AUTH_SECRET/DB creds go through a plain
    # .env, not a Docker secrets file - see docker-infisical/README.md for
    # why (no evidence Infisical supports reading these from mounted files,
    # unlike the AWS credentials above). Generated out-of-band per that
    # README (openssl rand), never by Ansible - same pattern as every other
    # credential in this pipeline.
    - name: Write the .env file
      ansible.builtin.copy:
        dest: "{{ stack_dir }}/.env"
        content: |
          POSTGRES_USER={{ infisical_postgres_user | default('infisical') }}
          POSTGRES_PASSWORD={{ infisical_postgres_password }}
          POSTGRES_DB={{ infisical_postgres_db | default('infisical') }}
          ENCRYPTION_KEY={{ infisical_encryption_key }}
          AUTH_SECRET={{ infisical_auth_secret }}
          SECRETS_HOST={{ secrets_domain }}
          AWS_REGION={{ route53_bauer_region | default('us-east-1') }}
          AWS_HOSTED_ZONE_ID={{ route53_bauer_hosted_zone_id | default('') }}
          DATA_DIR={{ secrets_data_dir }}
          ALLOW_INTERNAL_IP_CONNECTIONS={{ allow_internal_ip_connections | default('false') }}
          {# Enrollment tokens are single-use, but harmless once spent (the
             CLI skips re-enrollment and reuses stored credentials once
             already enrolled - confirmed live) - so unlike most secrets in
             this pipeline, there's no reason to avoid persisting the
             already-used value in extra-vars.yml. Keeping these
             unconditional (always written, blank if unset) avoids a worse
             failure mode: if they were only written when passed via -e,
             forgetting to re-pass them on some unrelated future deploy
             would blank out an already-working relay/gateway's command
             args entirely, not just skip a no-op re-enrollment. #}
          RELAY_NAME={{ relay_name | default('') }}
          RELAY_ENROLLMENT_TOKEN={{ relay_enrollment_token | default('') }}
          GATEWAY_NAME={{ gateway_name | default('') }}
          GATEWAY_ENROLLMENT_TOKEN={{ gateway_enrollment_token | default('') }}
        mode: '0600'

    - name: Deploy the Infisical stack
      ansible.builtin.command: docker compose up -d --build
      args:
        chdir: "{{ stack_dir }}"
      changed_when: true
