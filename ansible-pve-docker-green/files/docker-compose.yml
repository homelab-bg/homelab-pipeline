---
# Standalone Traefik + Portainer for docker1 (single host, `docker compose up -d`
# - not Swarm mode, see ansible-pve-docker-swarm/docker-traefik-portainer for that
# variant). docker1.lan.homelab.green is the host's own identity (SSH,
# inventory); Traefik's dashboard and Portainer's UI each get their own CNAME
# onto it instead (traefik.lan.homelab.green / portainer.lan.homelab.green -
# see tf-pve-docker-green/dns.tf), matching the swarm build's one-domain-
# per-service pattern.
#
# AWS credentials for the Route53 DNS-01 challenge are delivered via a mounted
# secrets file (AWS_SHARED_CREDENTIALS_FILE), not plain environment variables -
# plain env vars are visible via `docker inspect`, this isn't.
services:
  traefik:
    image: traefik:${TRAEFIK_VER:-v3.7.10}
    container_name: traefik
    restart: unless-stopped
    command:
      - --log.level=INFO
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.letsencrypt.acme.dnschallenge=true
      - --certificatesresolvers.letsencrypt.acme.dnschallenge.provider=route53
      - --certificatesresolvers.letsencrypt.acme.dnschallenge.resolvers=${DNS_RESOLVER:-9.9.9.9}
      - --certificatesresolvers.letsencrypt.acme.dnschallenge.delayBeforeCheck=30
      - --certificatesresolvers.letsencrypt.acme.email=${LETSENCRYPT_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --api.dashboard=true
      - --api.insecure=false
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
    environment:
      - AWS_SHARED_CREDENTIALS_FILE=/run/secrets/aws_credentials
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_HOSTED_ZONE_ID=${AWS_HOSTED_ZONE_ID}
    secrets:
      - aws_credentials
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_letsencrypt:/letsencrypt
    networks:
      - traefik
    labels:
      traefik.enable: "true"
      traefik.http.routers.traefik.rule: Host(`${TRAEFIK_HOST}`)
      traefik.http.routers.traefik.tls: "true"
      traefik.http.routers.traefik.tls.certresolver: letsencrypt
      traefik.http.routers.traefik.service: api@internal
      # The router above points at the special api@internal service, so this
      # port is never actually used for routing - but Traefik still tries to
      # build a default load-balancer service for any traefik.enable=true
      # container and errors ("port is missing") without one. 8080 is
      # Traefik's own internal API/dashboard port.
      traefik.http.services.traefik.loadbalancer.server.port: "8080"

  portainer:
    image: portainer/portainer-${PORTAINER_EDITION:-ce}:${PORTAINER_VER:-latest}
    container_name: portainer
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - traefik
    labels:
      traefik.enable: "true"
      traefik.http.routers.portainer.rule: Host(`${PORTAINER_HOST}`)
      traefik.http.routers.portainer.tls: "true"
      traefik.http.routers.portainer.tls.certresolver: letsencrypt
      traefik.http.services.portainer.loadbalancer.server.port: "${PORTAINER_PORT:-9000}"

secrets:
  aws_credentials:
    file: ./secrets/aws_credentials

volumes:
  portainer_data:
  traefik_letsencrypt:

networks:
  traefik:
    name: ${NETWORK:-traefik}
    external: false
