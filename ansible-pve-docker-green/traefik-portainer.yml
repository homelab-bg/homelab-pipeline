---
- name: Deploy Traefik + Portainer + dnsweaver on docker1
  hosts: green
  vars:
    stack_dir: "{{ ansible_env.HOME }}/traefik-portainer"
    # Route53/dnsweaver credentials - scoped read-only to this playbook's own
    # /ansible-pve-docker-green folder via a dedicated machine identity (same
    # least-privilege-per-consumer pattern as the Terraform modules - see
    # homelab-pipeline README).
    dns01_secrets: "{{ lookup('infisical.vault.read_secrets',
      universal_auth_client_id=infisical_client_id,
      universal_auth_client_secret=infisical_client_secret,
      project_id=infisical_project_id,
      env_slug='prod',
      path='/ansible-pve-docker-green',
      as_dict=True,
      url=infisical_host
      ) }}"

  tasks:
    - name: Check whether the stack directory is already a git checkout
      ansible.builtin.stat:
        path: "{{ stack_dir }}/.git"
      register: stack_dir_git

    # One-time transition safety: an existing stack_dir from the old
    # rsync-based deploy isn't a git repo, and `git clone` refuses to clone
    # into an existing non-empty, non-git directory. Harmless on every
    # later run once it's a real checkout (stat above finds .git, this is
    # skipped) - secrets/ gets rewritten by the tasks below regardless, so
    # there's nothing here worth preserving across the one-time wipe.
    - name: Remove non-git stack directory before first git-based deploy
      ansible.builtin.file:
        path: "{{ stack_dir }}"
        state: absent
      when: not stack_dir_git.stat.exists

    # Clones directly from GitHub (public repo, no credentials needed on
    # docker1) rather than rsyncing a local sibling clone - guarantees what's
    # deployed always matches a real pushed commit, no risk of deploying
    # stale or uncommitted local state. Pinned to a release tag (see
    # docker_traefik_portainer_version's default, YYYY.MM.releaseID) rather
    # than tracking main, so a redeploy doesn't silently pick up whatever's
    # newest - bump the tag deliberately when you want to move forward.
    # Untracked files (secrets/, below) survive a re-pull untouched - the
    # git module's default (force=no) only refuses to overwrite local
    # changes to *tracked* files, it never touches anything outside the
    # repo's tracked tree.
    - name: Clone/update docker-traefik-portainer from GitHub
      ansible.builtin.git:
        repo: https://github.com/homelab-bg/docker-traefik-portainer.git
        dest: "{{ stack_dir }}"
        version: "{{ docker_traefik_portainer_version | default('2026.08.1') }}"

    - name: Ensure secrets directory exists
      ansible.builtin.file:
        path: "{{ stack_dir }}/secrets"
        state: directory
        mode: '0700'

    - name: Write the AWS credentials file for Traefik's Route53 DNS-01 challenge
      ansible.builtin.copy:
        dest: "{{ stack_dir }}/secrets/aws_credentials"
        content: |
          [default]
          aws_access_key_id = {{ dns01_secrets.ROUTE53_GREEN_ACCESS_KEY_ID }}
          aws_secret_access_key = {{ dns01_secrets.ROUTE53_GREEN_SECRET_ACCESS_KEY }}
        mode: '0600'

    - name: Write the Technitium API token file for dnsweaver
      ansible.builtin.copy:
        dest: "{{ stack_dir }}/secrets/technitium_token"
        content: "{{ dns01_secrets.DNSWEAVER_TECHNITIUM_TOKEN }}"
        mode: '0600'

    - name: Deploy the traefik-portainer stack
      ansible.builtin.command: docker compose up -d
      environment:
        TRAEFIK_HOST: "{{ traefik_domain }}"
        PORTAINER_HOST: "{{ portainer_domain }}"
        LETSENCRYPT_EMAIL: "{{ traefik_email }}"
        PORTAINER_PORT: "{{ portainer_port | default('9000') }}"
        PORTAINER_VER: "{{ portainer_version | default('2.33.1') }}"
        TRAEFIK_VER: "{{ traefik_version | default('v3.7.10') }}"
        DNSWEAVER_VER: "{{ dnsweaver_version | default('latest') }}"
        NETWORK: "{{ network_name | default('traefik') }}"
        AWS_REGION: "{{ dns01_secrets.ROUTE53_GREEN_REGION | default('us-east-1') }}"
        AWS_HOSTED_ZONE_ID: "{{ dns01_secrets.ROUTE53_GREEN_HOSTED_ZONE_ID }}"
        TECHNITIUM_URL: "{{ technitium_url }}"
        DNSWEAVER_ZONE: "{{ dnsweaver_zone }}"
        DNSWEAVER_DOMAINS: "{{ dnsweaver_domains }}"
        DATA_DIR: "{{ docker_green_data_dir | default('/mnt/cephfs/docker-green') }}"
        COMPOSE_PROFILES: "{{ dnsweaver_profile | default('dnsweaver') }}"
      args:
        chdir: "{{ stack_dir }}"
      changed_when: true
