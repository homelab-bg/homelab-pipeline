---
- name: Mount shared CephFS storage on docker1
  hosts: green
  become: true
  vars:
    # Same scoped machine identity/folder as traefik-portainer.yml - both
    # playbooks belong to this module (see homelab-pipeline README).
    cephfs_secrets: "{{ lookup('infisical.vault.read_secrets',
      universal_auth_client_id=infisical_client_id,
      universal_auth_client_secret=infisical_client_secret,
      project_id=infisical_project_id,
      env_slug='prod',
      path='/ansible-pve-docker-green',
      as_dict=True,
      url=infisical_host
      ) }}"
  tasks:
    - name: Install ceph-common (provides the mount.ceph helper)
      ansible.builtin.apt:
        name: ceph-common
        state: present
        update_cache: true

    - name: Ensure /etc/ceph exists
      ansible.builtin.file:
        path: /etc/ceph
        state: directory
        mode: '0755'

    - name: Write the CephFS client keyring
      ansible.builtin.copy:
        dest: "/etc/ceph/ceph.client.{{ cephfs_client_name }}.keyring"
        content: |
          [client.{{ cephfs_client_name }}]
              key = {{ cephfs_secrets.CEPHFS_CLIENT_KEY }}
        mode: '0600'

    - name: Ensure the CephFS mount point exists
      ansible.builtin.file:
        path: "{{ cephfs_mount_path | default('/mnt/cephfs') }}"
        state: directory
        mode: '0755'

    - name: Mount CephFS (and persist to fstab)
      ansible.posix.mount:
        path: "{{ cephfs_mount_path | default('/mnt/cephfs') }}"
        src: "{{ cephfs_mon_hosts | join(',') }}:/"
        fstype: ceph
        opts: "name={{ cephfs_client_name }},fs={{ cephfs_name }},noatime,_netdev"
        state: mounted
