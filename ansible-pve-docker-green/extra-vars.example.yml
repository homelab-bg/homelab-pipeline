---
# Copy to extra-vars.yml and fill in real values - extra-vars.yml is gitignored.
# Run with: ansible-playbook -i hosts.yml bootstrap.yml --ask-become-pass -e @extra-vars.yml

traefik_email: traefik@example.internal
traefik_version: v3.7.10 # v3.6.0+ required on Docker 29+ hosts
traefik_domain: traefik.lan.example.green

# CNAME onto docker1.lan.example.green (see tf-pve-docker-green/dns.tf) - not
# the host's own domain, so Portainer and the Traefik dashboard each get a
# distinct hostname/cert rather than sharing docker1's.
portainer_domain: portainer.lan.example.green
portainer_version: 2.33.1
portainer_port: 9000
# No portainer_edition/portainer_license_key here - this stack defaults to
# Portainer CE (files/docker-compose.yml's ${PORTAINER_EDITION:-ce}), not the
# swarm's BE licence, since that licence is scoped to that Portainer instance.

network_name: traefik

# Route53 DNS-01 challenge credentials, scoped to the PUBLIC homelab.green
# hosted zone - separate IAM user from bauer.com.au's, separate from the
# INTERNAL lan.homelab.green Technitium zone (see tf-pve-docker-green). See
# the handover doc's draft least-privilege policy before widening this.
route53_green_access_key_id: changeme
route53_green_secret_access_key: changeme
route53_green_region: us-east-1
route53_green_hosted_zone_id: ""

# CephFS - shared storage mounted on docker1 at /mnt/cephfs. See cephfs-mount.yml.
# client key comes from `ceph fs authorize cephfs client.green / rw` on the PVE
# cluster - own key, not swarm's client.swarm, same least-privilege-per-consumer
# pattern as everything else in this pipeline.
cephfs_mon_hosts:
  - 10.0.0.201
  - 10.0.0.202
  - 10.0.0.203
cephfs_name: cephfs
cephfs_client_name: green
cephfs_client_key: changeme
