---
# Copy to extra-vars.yml and fill in real values - extra-vars.yml is gitignored.
# Run with: ansible-playbook -i hosts.yml bootstrap.yml --ask-become-pass -e @extra-vars.yml

traefik_email: traefik@example.internal
traefik_version: v3.7.10 # v3.6.0+ required on Docker 29+ hosts
traefik_domain: traefik.lan.example.green

# CNAME onto traefik_domain, not docker1's own domain (see
# tf-pve-docker-green/dns.tf) - reflects the actual request path (client ->
# Traefik -> Portainer container) rather than the bare host address.
portainer_domain: portainer.lan.example.green
portainer_version: 2.33.1
portainer_port: 9000
# No portainer_edition/portainer_license_key here - this stack defaults to
# Portainer CE (docker-traefik-portainer's docker-compose.yml has
# ${PORTAINER_EDITION:-ce}), not the swarm's BE licence, since that licence
# is scoped to that Portainer instance.

network_name: traefik

# dnsweaver - dedicated Technitium user (e.g. "dnsweaver"), scoped to just
# the internal lan.example.green zone (view/modify/delete permissions,
# nothing else) via `POST /api/zones/permissions/set`, then a token created
# for that user via `POST /api/user/createToken` (not the admin token) -
# same out-of-band, least-privilege-per-consumer pattern as every other
# credential in this pipeline. Confirm scoping worked by testing the token
# against a zone it should NOT have access to before trusting it.
technitium_url: https://ns1.lan.example.internal
dnsweaver_version: v2.7.3
dnsweaver_zone: lan.example.green
dnsweaver_domains: "*.lan.example.green"

# dnsweaver_technitium_token and route53_green_* moved to Infisical
# (/ansible-pve-docker-green folder, "prod" env) - traefik-portainer.yml
# reads them at deploy time via the infisical.vault.read_secrets lookup,
# authenticated through this playbook's own scoped machine identity below.
infisical_host: https://secrets.lan.example.com
infisical_project_id: changeme
infisical_client_id: changeme
infisical_client_secret: changeme

# CephFS - shared storage mounted on docker1 at /mnt/cephfs. See cephfs-mount.yml.
# client key comes from `ceph fs authorize cephfs client.green / rw` on the PVE
# cluster - own key, not swarm's client.swarm, same least-privilege-per-consumer
# pattern as everything else in this pipeline.
cephfs_mon_hosts:
  - 10.0.0.201
  - 10.0.0.202
  - 10.0.0.203
cephfs_name: cephfs
cephfs_client_name: green
# cephfs_client_key moved to Infisical (/ansible-pve-docker-green folder) -
# read at deploy time by cephfs-mount.yml via the same lookup as
# traefik-portainer.yml.
